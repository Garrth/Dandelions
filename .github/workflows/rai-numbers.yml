# Rai's numbers: once a week, pull the public numbers for each county and save any that changed.
# Run it by hand from the Actions tab: Rai's numbers > Run workflow.
name: Rai's numbers

on:
  schedule:
    - cron: '17 14 * * 1'  # Mondays, about 7am in California
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rai-numbers
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - name: Pull the numbers
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python3 tools/rai_numbers.py
      - name: Count businesses in each county
        run: python3 tools/county_businesses.py
      # main only takes changes through a pull request, so this opens one and merges it right away.
      # Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
      - name: Save what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data/rai
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          branch="rai-numbers/$day-$GITHUB_RUN_ID"
          git config user.name "rai-numbers"
          git config user.email "rai-numbers@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Rai's numbers for $day"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Rai's numbers for $day" --body "Weekly public numbers, saved by the Rai's numbers workflow."
          gh pr merge "$branch" --merge --delete-branch
